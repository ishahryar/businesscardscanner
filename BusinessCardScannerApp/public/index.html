<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Business Card Scanner</title>
    <!-- Modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --secondary: #ec4899;
            --dark: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15) 0%, transparent 50%);
            padding: 1rem;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeUp 0.8s ease-out;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 1.5rem;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .upload-area:hover .upload-icon {
            transform: translateY(-5px);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 99px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-container {
            display: none;
            margin-bottom: 1.5rem;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .preview-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Loading Overlay */
        .loading-overlay {
            display: none;
            text-align: center;
            padding: 2rem 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Results Card */
        #results-container {
            display: none;
            animation: fadeUp 0.5s ease;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            flex-direction: column;
        }

        .result-label {
            font-size: 0.75rem;
            color: var(--primary-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        .result-value {
            font-size: 1.05rem;
            font-weight: 500;
        }

        /* Mobile specific adjustments built directly in container setup, fits nicely */
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Scanner App</h1>
            <p>Snap a business card, let AI do the rest.</p>
        </div>

        <div id="upload-section">
            <div class="upload-area" id="upload-area">
                <input type="file" id="file-input" accept="image/*" capture="environment">
                <span class="upload-icon">📸</span>
                <h3>Tap to Take Photo</h3>
                <p style="margin-top: 0.5rem; font-size: 0.85rem; color: var(--text-muted);">or choose from gallery</p>
            </div>

            <div class="preview-container" id="preview-container">
                <img id="image-preview" src="" alt="Card Preview">
            </div>

            <button class="btn" id="scan-btn" disabled>
                ✨ Scan With AI
            </button>
        </div>

        <div class="loading-overlay" id="loading-overlay">
            <div class="spinner"></div>
            <h3 id="loading-text">Extracting text...</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.5rem;">This might take a few seconds
            </p>
        </div>

        <div id="results-container">
            <h3
                style="margin-bottom: 1rem; background: linear-gradient(135deg, #fff, #cbd5e1); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                Extracted Details</h3>

            <div id="details-list">
                <!-- Injected via JS -->
            </div>

            <button class="btn" id="reset-btn"
                style="margin-top: 1.5rem; background: rgba(255,255,255,0.1); box-shadow: none;">
                Scan Another Card
            </button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const uploadArea = document.getElementById('upload-area');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const scanBtn = document.getElementById('scan-btn');

        const uploadSection = document.getElementById('upload-section');
        const loadingOverlay = document.getElementById('loading-overlay');
        const resultsContainer = document.getElementById('results-container');
        const detailsList = document.getElementById('details-list');
        const loadingText = document.getElementById('loading-text');

        let base64Image = null;

        // Handle file selection (Camera or Gallery)
        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            // Limit UI image rendering overhead, wait until loaded
            reader.onload = function (event) {
                base64Image = event.target.result;

                // Show preview
                imagePreview.src = base64Image;
                uploadArea.style.display = 'none';
                previewContainer.style.display = 'block';

                // Enable button
                scanBtn.disabled = false;
            };

            reader.readAsDataURL(file);
        });

        scanBtn.addEventListener('click', async () => {
            if (!base64Image) return;

            // UI State change
            uploadSection.style.display = 'none';
            loadingOverlay.style.display = 'block';

            // Loading text rotation to keep user engaged
            const loadingStates = ['Extracting text from image...', 'Parsing contact info...', 'Generating sales email...', 'Finalizing details...'];
            let stateIdx = 0;
            const loaderInterval = setInterval(() => {
                stateIdx = (stateIdx + 1) % loadingStates.length;
                loadingText.innerText = loadingStates[stateIdx];
            }, 2000);

            try {
                // Send API request
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageBase64: base64Image })
                });

                const apiResult = await response.json();
                clearInterval(loaderInterval);

                if (!apiResult.success) {
                    throw new Error(apiResult.error || 'Server returned an error');
                }

                // Render Results
                displayResults(apiResult.data.contactDetails);

            } catch (err) {
                clearInterval(loaderInterval);
                alert(`Scanning Failed: ${err.message}`);
                // Revert UI
                loadingOverlay.style.display = 'none';
                uploadSection.style.display = 'block';
            }
        });

        function displayResults(details) {
            loadingOverlay.style.display = 'none';
            resultsContainer.style.display = 'block';

            if (!details) {
                detailsList.innerHTML = '<p style="color:var(--secondary)">Could not extract details clearly. Try again.</p>';
                return;
            }

            detailsList.innerHTML = '';

            // Map details to fancy cards
            const fields = [
                { key: 'name', label: 'Name' },
                { key: 'title', label: 'Job Title' },
                { key: 'company', label: 'Company' },
                { key: 'email', label: 'Email Address' },
                { key: 'phone', label: 'Phone Number' },
                { key: 'industry', label: 'AI Suggested Industry' }
            ];

            fields.forEach(field => {
                const val = details[field.key];
                if (val && val !== '') {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    item.innerHTML = `
                        <span class="result-label">${field.label}</span>
                        <span class="result-value">${val}</span>
                    `;
                    detailsList.appendChild(item);
                }
            });
        }

        document.getElementById('reset-btn').addEventListener('click', () => {
            base64Image = null;
            fileInput.value = '';
            imagePreview.src = '';
            resultsContainer.style.display = 'none';
            previewContainer.style.display = 'none';
            uploadArea.style.display = 'block';
            uploadSection.style.display = 'block';
            scanBtn.disabled = true;
        });

    </script>
</body>

</html>
